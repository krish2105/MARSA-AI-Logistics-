[project]
name = "marsa"
version = "0.2.0"
description = "MARSA AI — adaptive-RAG trade & logistics copilot (backend)"
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tenacity>=8.3",
    "typer>=0.12",
    "rich>=13.7",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "selectolax>=0.3.21",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "psycopg[binary]>=3.1",
    "networkx>=3.3",
]

[project.optional-dependencies]
# Heavy, and only usable where huggingface.co is reachable. Kept optional so a
# blocked-egress environment is not forced to install torch to run the pipeline.
ml = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
marsa-ingest = "marsa.ingestion.cli:app"
marsa-index = "marsa.indexing.cli:app"
marsa-graph = "marsa.graph.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008 forbids function calls in argument defaults. `typer.Option(...)` in the
# signature *is* Typer's declaration syntax — there is no idiomatic alternative,
# so the rule is suppressed for the CLI module only, not project-wide.
"src/marsa/ingestion/cli.py" = ["B008"]
