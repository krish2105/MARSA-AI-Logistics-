name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — lint, type-check, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  backend:
    name: Backend — ruff, pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # pgvector integration tests run against a real database rather than a
    # mock — mocking a vector store mostly tests the mock. They skip cleanly
    # when MARSA_TEST_DSN is unset, so this service is what actually exercises
    # the SQL, the HNSW index and the distance-to-similarity conversion.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: marsa
          POSTGRES_PASSWORD: marsa
          POSTGRES_DB: marsa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MARSA_TEST_DSN: postgresql://marsa:marsa@localhost:5432/marsa

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      # The suite is fully offline — every upstream is respx-mocked — so CI
      # never depends on a public API being reachable or in a good mood.
      - name: Test
        run: pytest

      # End-to-end: generate corpora, build the index into the real pgvector
      # service, then run a query. Catches wiring breaks that unit tests miss.
      - name: Pipeline smoke test
        run: |
          marsa-ingest fixtures --rulings 50 --orders 200
          marsa-ingest status
          DATABASE_URL="$MARSA_TEST_DSN" marsa-index build --embedding-backend hashed
          DATABASE_URL="$MARSA_TEST_DSN" marsa-index stats
          DATABASE_URL="$MARSA_TEST_DSN" marsa-index query "8507.60.0020"
          marsa-ml train
          marsa-ml congestion
          marsa-graph build
          marsa-graph stats
          marsa-graph query "Which suppliers are exposed if Jebel Ali congestion worsens?"

      # Route one query down each of the three paths through the real
      # LangGraph router, and confirm the API boots.
      - name: Router smoke test
        env:
          DATABASE_URL: ${{ env.MARSA_TEST_DSN }}
        run: |
          python - <<'EOF'
          from marsa.router.graph import Router
          router = Router("heuristic")
          expected = {
              "What HTS code applies to lithium-ion power banks?": "fast",
              "Which of our shipments are exposed if the tariff on HS 8541 takes effect?": "agentic",
              "Which suppliers are exposed if Jebel Ali congestion worsens?": "graph",
          }
          for query, want in expected.items():
              audit = router.run(query)
              assert audit.path == want, f"{query!r} routed to {audit.path}, expected {want}"
              print(f"OK {audit.path:8s} {audit.latency_ms:7.1f}ms  {query[:50]}")
          EOF
          python -c "from marsa.api.main import app; print('API imports OK:', app.title)"

      # The labelled set is hand-written, so it is the part most likely to
      # silently drift out of balance or pick up a duplicate — either of which
      # would quietly corrupt the accuracy figure. This fails the build first,
      # before anything measures anything.
      - name: Validate the labelled routing set
        run: marsa-eval dataset

      # Runs the whole harness and regenerates RESULTS.md. Without an API key
      # or live corpora the gate refuses to publish and stamps it PROVISIONAL,
      # which is the behaviour under test as much as the numbers are.
      - name: Evaluation harness
        env:
          DATABASE_URL: ${{ env.MARSA_TEST_DSN }}
        run: |
          marsa-eval run --limit 12
          python - <<'EOF'
          import json, pathlib
          results = json.loads(pathlib.Path("../data/eval/results.json").read_text())
          gate = results["gate"]
          # CI has no LLM provider and only fixture corpora, so a FINAL stamp
          # here would mean the gate had stopped working.
          assert not gate["mayPublish"], "gate published from synthetic corpora"
          assert gate["status"] == "PROVISIONAL", gate["status"]
          assert len(gate["blockers"]) == 3, gate["blockers"]
          print(f"OK gate held: {len(gate['blockers'])} blockers, status {gate['status']}")
          EOF
