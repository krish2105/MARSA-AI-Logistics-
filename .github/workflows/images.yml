name: Images

# Publishes both container images to GitHub Container Registry so a deploy can
# pull a tag instead of rebuilding. Uses the built-in GITHUB_TOKEN — no secrets
# to configure.
#
# Runs only after CI passes on the same commit. Publishing an image that failed
# its tests just moves the failure somewhere harder to see.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: images-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    # `workflow_run` fires on failure too, so the result has to be checked
    # explicitly — there is no `on: workflow_run: conclusion` filter.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default, which would
          # build the wrong commit entirely.
          ref: ${{ github.event.workflow_run.head_sha }}

      # Runs before anything is built or pushed, so a misconfigured frontend
      # fails in seconds rather than after a full image build.
      #
      # `NEXT_PUBLIC_*` is inlined into the client bundle by `next build`, so
      # the published frontend image is permanently bound to whatever gateway
      # URL is set here. Defaulting to localhost publishes an image that runs
      # in fixture mode wherever it is deployed, shows "unreachable — replaying
      # local fixtures", and gives no clue that the image itself is the reason.
      # A build that stops is far cheaper to diagnose than an image that lies.
      - name: Require a gateway URL for the frontend image
        if: matrix.name == 'frontend'
        env:
          GATEWAY_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          if [ -z "$GATEWAY_URL" ]; then
            echo "::error title=No gateway URL::NEXT_PUBLIC_API_BASE_URL is not set."
            echo "The frontend image would be built against localhost and run in"
            echo "fixture mode everywhere. Set the repository variable:"
            echo "  Settings → Secrets and variables → Actions → Variables"
            echo "  NEXT_PUBLIC_API_BASE_URL = https://<your-gateway>.onrender.com"
            echo "Deploy the gateway first — see DEPLOY.md."
            exit 1
          fi

          # A trailing slash turns `\${API_BASE}/health` into `//health`, which
          # most servers treat as a different path. The probe 404s, the console
          # decides the gateway is down, and the URL looks correct by eye.
          case "$GATEWAY_URL" in
            */) echo "::error title=Trailing slash::'$GATEWAY_URL' ends with '/'. Requests would be built as '//health' and 404. Remove it."
                exit 1 ;;
          esac

          # Vercel serves the page over https, so an http gateway is blocked as
          # mixed content by the browser before the request is sent — the same
          # invisible failure as a CORS rejection. localhost is exempt: browsers
          # treat it as a secure context.
          case "$GATEWAY_URL" in
            https://*) ;;
            http://localhost*|http://127.0.0.1*) ;;
            *) echo "::error title=Insecure gateway::'$GATEWAY_URL' is not https. The browser blocks it as mixed content from an https page, before any request is sent."
               exit 1 ;;
          esac

          echo "Building the frontend image against $GATEWAY_URL"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Deliberately NOT `github.repository`. This repo is named
          # `MARSA-AI-Logistics-`, and an OCI path component must both start
          # and end with an alphanumeric — a trailing hyphen is rejected by the
          # registry, so `.../marsa-ai-logistics-/backend` would fail to push.
          # The action lowercases what it is given; it does not repair this.
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/marsa-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.event.workflow_run.head_branch == github.event.repository.default_branch }}
            type=raw,value=${{ github.event.workflow_run.head_branch }}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # No fallback on purpose — the guard step above has already refused
          # to get here without a real gateway URL. The backend image ignores
          # this build-arg entirely.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
