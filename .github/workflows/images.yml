name: Images

# Publishes both container images to GitHub Container Registry so a deploy can
# pull a tag instead of rebuilding. Uses the built-in GITHUB_TOKEN — no secrets
# to configure.
#
# Runs only after CI passes on the same commit. Publishing an image that failed
# its tests just moves the failure somewhere harder to see.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: images-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    # `workflow_run` fires on failure too, so the result has to be checked
    # explicitly — there is no `on: workflow_run: conclusion` filter.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default, which would
          # build the wrong commit entirely.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Deliberately NOT `github.repository`. This repo is named
          # `MARSA-AI-Logistics-`, and an OCI path component must both start
          # and end with an alphanumeric — a trailing hyphen is rejected by the
          # registry, so `.../marsa-ai-logistics-/backend` would fail to push.
          # The action lowercases what it is given; it does not repair this.
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/marsa-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.event.workflow_run.head_branch == github.event.repository.default_branch }}
            type=raw,value=${{ github.event.workflow_run.head_branch }}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # NEXT_PUBLIC_* is inlined at build time, so the published frontend
          # image points at whatever gateway URL is set here. The repository
          # variable lets it be changed without editing this file; the default
          # produces an image that only works against a local gateway.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:8000' }}
