name: Images

# Publishes both container images to GitHub Container Registry so a deploy can
# pull a tag instead of rebuilding. Uses the built-in GITHUB_TOKEN — no secrets
# to configure.
#
# Runs only after CI passes on the same commit. Publishing an image that failed
# its tests just moves the failure somewhere harder to see.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: images-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    # `workflow_run` fires on failure too, so the result has to be checked
    # explicitly — there is no `on: workflow_run: conclusion` filter.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default, which would
          # build the wrong commit entirely.
          ref: ${{ github.event.workflow_run.head_sha }}

      # Runs before anything is built or pushed, so a misconfigured frontend
      # fails in seconds rather than after a full image build.
      #
      # `NEXT_PUBLIC_*` is inlined into the client bundle by `next build`, so
      # the published frontend image is permanently bound to whatever gateway
      # URL is set here. Defaulting to localhost publishes an image that runs
      # in fixture mode wherever it is deployed, shows "unreachable — replaying
      # local fixtures", and gives no clue that the image itself is the reason.
      # A build that stops is far cheaper to diagnose than an image that lies.
      - name: Require a gateway URL for the frontend image
        if: matrix.name == 'frontend'
        env:
          GATEWAY_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          if [ -z "$GATEWAY_URL" ]; then
            echo "::error title=No gateway URL::NEXT_PUBLIC_API_BASE_URL is not set."
            echo "The frontend image would be built against localhost and run in"
            echo "fixture mode everywhere. Set the repository variable:"
            echo "  Settings → Secrets and variables → Actions → Variables"
            echo "  NEXT_PUBLIC_API_BASE_URL = https://<your-gateway>.onrender.com"
            echo "Deploy the gateway first — see DEPLOY.md."
            exit 1
          fi

          # A trailing slash turns `\${API_BASE}/health` into `//health`, which
          # most servers treat as a different path. The probe 404s, the console
          # decides the gateway is down, and the URL looks correct by eye.
          case "$GATEWAY_URL" in
            */) echo "::error title=Trailing slash::'$GATEWAY_URL' ends with '/'. Requests would be built as '//health' and 404. Remove it."
                exit 1 ;;
          esac

          # Vercel serves the page over https, so an http gateway is blocked as
          # mixed content by the browser before the request is sent — the same
          # invisible failure as a CORS rejection. localhost is exempt: browsers
          # treat it as a secure context.
          case "$GATEWAY_URL" in
            https://*) ;;
            http://localhost*|http://127.0.0.1*) ;;
            *) echo "::error title=Insecure gateway::'$GATEWAY_URL' is not https. The browser blocks it as mixed content from an https page, before any request is sent."
               exit 1 ;;
          esac

          echo "Building the frontend image against $GATEWAY_URL"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Deliberately NOT `github.repository`. This repo is named
          # `MARSA-AI-Logistics-`, and an OCI path component must both start
          # and end with an alphanumeric — a trailing hyphen is rejected by the
          # registry, so `.../marsa-ai-logistics-/backend` would fail to push.
          # The action lowercases what it is given; it does not repair this.
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/marsa-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.event.workflow_run.head_branch == github.event.repository.default_branch }}
            type=raw,value=${{ github.event.workflow_run.head_branch }}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # No fallback on purpose — the guard step above has already refused
          # to get here without a real gateway URL. The backend image ignores
          # this build-arg entirely.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}

  # Nothing had ever *run* the backend image — only built it. The entrypoint
  # (boot-time index build, the pgvector fallback guard, $PORT binding, the
  # non-root user's write access to /app/data) was verified by simulating the
  # shell logic, which is not the same as executing it in the container.
  #
  # Deploying to Render would otherwise be the first real boot, on the machine
  # least convenient to debug. This runs it here instead.
  #
  # Deliberately does NOT `needs: build` — that would wait on the frontend leg,
  # which fails by design until a gateway URL is configured, and would skip
  # this entirely. It rebuilds from the same cache scope, so it is cheap.
  smoke:
    name: Backend image boots and serves
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: marsa
          POSTGRES_PASSWORD: marsa
          POSTGRES_DB: marsa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Build the backend image into the local daemon
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: marsa-backend:smoke
          cache-from: type=gha,scope=backend

      - name: It boots against pgvector and serves /health
        run: |
          docker run -d --name marsa --network host \
            -e DATABASE_URL=postgresql://marsa:marsa@127.0.0.1:5432/marsa \
            -e MARSA_REQUIRE_PGVECTOR=true \
            marsa-backend:smoke

          # Generous: the boot builds the fast-path index before serving.
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/tmp/health.json 2>/dev/null; then
              echo "healthy after ${i}s"; break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' marsa)" != "true" ]; then
              echo "::error::container exited during boot"; docker logs marsa; exit 1
            fi
            sleep 1
          done

          docker logs marsa
          test -s /tmp/health.json || { echo "::error::never became healthy"; exit 1; }
          python3 - <<'EOF'
          import json
          h = json.load(open("/tmp/health.json"))
          print(json.dumps(h, indent=2))
          assert h["status"] in {"ok", "degraded"}, h["status"]
          # The whole point of baking artifacts into the image: these must be
          # true on a cold container with no volumes attached.
          assert h["resources"]["fastPathIndex"], "fast-path index missing on a cold boot"
          assert h["resources"]["supplyGraph"], "supply graph missing on a cold boot"
          print("OK cold boot has both resources")
          EOF

      - name: It answers a real query end to end
        run: |
          curl -fsS -X POST http://127.0.0.1:8000/query \
            -H 'Content-Type: application/json' \
            -d '{"query":"Which suppliers are exposed if Jebel Ali congestion worsens?"}' \
            -o /tmp/q.json
          python3 - <<'EOF'
          import json
          a = json.load(open("/tmp/q.json"))
          assert a["path"] == "graph", a["path"]
          assert a["answer"].strip(), "empty answer"
          print(f"OK routed to {a['path']} in {a['latencyMs']:.0f}ms")
          EOF
          docker rm -f marsa

      - name: It refuses to start on a silent pgvector fallback
        run: |
          # An unreachable database does not fail the index build — it falls
          # back to an in-process numpy store and reports success. In
          # production that is a green container that never touches pgvector
          # and loses its vectors on restart, so render.yaml sets this flag.
          # Verify the flag actually stops the container.
          set +e
          docker run --name marsa-bad --network host \
            -e DATABASE_URL=postgresql://marsa:marsa@127.0.0.1:9999/nope \
            -e MARSA_REQUIRE_PGVECTOR=true \
            marsa-backend:smoke
          code=$?
          set -e
          docker logs marsa-bad 2>&1 | tail -5
          test "$code" -ne 0 || { echo "::error::booted despite a silent numpy fallback"; exit 1; }
          echo "OK refused to start (exit $code)"
